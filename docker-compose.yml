version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: recoverai-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recoverai_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recoverai_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-recoverai_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recoverai_user} -d ${POSTGRES_DB:-recoverai_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: recoverai-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: recoverai-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-recoverai_user}:${POSTGRES_PASSWORD:-recoverai_secret_pass}@postgres:5432/${POSTGRES_DB:-recoverai_db}
      - REDIS_URL=redis://redis:6379/0
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SECRET_KEY=${SECRET_KEY}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 10s
      retries: 3

  celery_worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: recoverai-celery-worker
    restart: always
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-recoverai_user}:${POSTGRES_PASSWORD:-recoverai_secret_pass}@postgres:5432/${POSTGRES_DB:-recoverai_db}
      - REDIS_URL=redis://redis:6379/0
    command: ["celery", "-A", "backend.app.tasks.worker", "worker", "--loglevel=info"]

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: recoverai-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
  redis_data:
